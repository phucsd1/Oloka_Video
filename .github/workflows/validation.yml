name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:frontend
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build production image
        run: |
          docker build \
            --build-arg APP_VERSION=0.1.0 \
            --build-arg GIT_COMMIT_SHA=${GITHUB_SHA} \
            --build-arg BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t oloka-video:${GITHUB_SHA} .
      - name: Verify production image restart persistence
        env:
          OLOKA_APP_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        run: |
          volume="oloka-video-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          first="oloka-video-first-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          second="oloka-video-second-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$first" "$second" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume" >/dev/null
          docker run -d --name "$first" -p 17860:7860 \
            -e OLOKA_APP_KEY="$OLOKA_APP_KEY" \
            -v "$volume:/data" oloka-video:${GITHUB_SHA} >/dev/null
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:17860/api/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:17860/api/health
          curl --fail http://127.0.0.1:17860/api/ready
          test "$(curl --fail --silent http://127.0.0.1:17860/api/version | jq -r .gitCommitSha)" = "$GITHUB_SHA"
          docker stop "$first" >/dev/null
          docker rm "$first" >/dev/null
          docker run -d --name "$second" -p 17860:7860 \
            -e OLOKA_APP_KEY="$OLOKA_APP_KEY" \
            -v "$volume:/data" oloka-video:${GITHUB_SHA} >/dev/null
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:17860/api/ready && break
            sleep 1
          done
          curl --fail http://127.0.0.1:17860/api/health
          curl --fail http://127.0.0.1:17860/api/ready
          test "$(curl --fail --silent http://127.0.0.1:17860/api/version | jq -r .gitCommitSha)" = "$GITHUB_SHA"
          docker exec "$second" node --input-type=module -e "
            import { access, mkdir, rm, writeFile } from 'node:fs/promises';
            import { DatabaseSync } from 'node:sqlite';
            const db = new DatabaseSync('/data/database/oloka-dev.db', { readOnly: true });
            const ledger = db.prepare('SELECT version, COUNT(*) AS count FROM schema_migrations GROUP BY version ORDER BY version').all();
            db.close();
            if (JSON.stringify(ledger) !== JSON.stringify([{ version: 1, count: 1 }, { version: 2, count: 1 }])) throw new Error('migration ledger replayed');
            await access('/data/database/oloka-dev.db-wal');
            await access('/data/database/oloka-dev.db-shm');
            const probe = '/data/backups/ci-write-test';
            await mkdir(probe, { recursive: true });
            await writeFile(probe + '/probe', 'ok', 'utf8');
            await rm(probe, { recursive: true });
          "
